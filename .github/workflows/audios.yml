# Gera os áudios que faltam (palavras, alfabeto e frases aplicadas) e grava no repositório.
# Roda nos servidores do GitHub quando as frases ou o gerador mudam, ou manualmente.
name: Gerar áudios

on:
  push:
    paths:
      - "conteudo/frases/**"
      - "gerar_audios.js"
      - ".github/workflows/audios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # se outro push chegou enquanto esta execução esperava na fila (por exemplo, o
      # commit de áudios de uma execução anterior), parte dele e não gera tudo de novo
      - name: Usar a versão mais nova da branch
        run: |
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o gtts
        run: npm install --no-save --ignore-scripts gtts
      - name: Gerar o que falta
        run: node gerar_audios.js
      - name: Gravar os áudios novos
        if: always()
        run: |
          git add audio
          if git diff --cached --quiet; then
            echo "Nenhum áudio novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Áudios gerados automaticamente"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
