<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <g transform="translate(150,150) scale(1.5)">
    <ellipse cx="0" cy="8" rx="72" ry="30" fill="#F3EEE2" stroke="#D2C4A2" stroke-width="2.5" filter="url(#wc)"/>
    <ellipse cx="0" cy="6" rx="50" ry="20" fill="#EAE0CA" stroke="#D2C4A2" stroke-width="2" filter="url(#wc)"/>
    <ellipse cx="0" cy="6" rx="40" ry="16" fill="none" stroke="#8AA6B4" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="5" rx="30" ry="11" fill="#F3EEE2" stroke="#DDD0B0" stroke-width="1.5" filter="url(#wc)"/>
  </g>
</svg>
