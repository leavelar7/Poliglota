<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <g transform="translate(150,152) scale(1.3)">
    <rect x="-34" y="8" width="30" height="30" rx="4" fill="#E7695A" stroke="#C64C3E" stroke-width="2" filter="url(#wc)"/>
    <rect x="2" y="8" width="30" height="30" rx="4" fill="#5A7896" stroke="#43607A" stroke-width="2" filter="url(#wc)"/>
    <rect x="-16" y="-24" width="30" height="30" rx="4" fill="#E7C44E" stroke="#CBA836" stroke-width="2" filter="url(#wc)"/>
    <text x="-19" y="30" font-family="Georgia" font-size="18" fill="#F6EEDD" text-anchor="middle">A</text>
    <text x="17" y="30" font-family="Georgia" font-size="18" fill="#F6EEDD" text-anchor="middle">B</text>
    <text x="-1" y="-2" font-family="Georgia" font-size="18" fill="#7A5A2A" text-anchor="middle">C</text>
  </g>
</svg>
