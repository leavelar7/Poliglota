<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <g transform="translate(150,150) scale(0.95)">
    <!-- tail -->
    <path d="M58 6 Q86 18 90 56 Q92 84 74 106 Q84 80 74 58 Q66 40 52 30 Q60 18 58 6 Z" fill="#5E3A1C" stroke="#472A12" stroke-width="2" filter="url(#wc)"/>
    <path d="M70 40 Q84 60 78 92" stroke="#472A12" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- hind legs -->
    <path d="M46 26 Q54 50 56 74 L52 100 Q51 109 59 109 L69 109 Q64 84 62 66 Q60 44 54 24 Z" fill="#A96A26" stroke="#8A5620" stroke-width="2" filter="url(#wc)"/>
    <path d="M34 34 Q40 58 40 80 L36 104 Q35 113 43 113 L53 113 Q50 86 48 70 Q46 50 42 32 Z" fill="#B0752A" stroke="#8A5620" stroke-width="2" filter="url(#wc)"/>
    <ellipse cx="61" cy="110" rx="7" ry="4" fill="#4A3B2E"/>
    <ellipse cx="45" cy="114" rx="7" ry="4" fill="#4A3B2E"/>
    <!-- body + neck + head -->
    <path d="M60 4 Q20 -18 -18 -22 Q-34 -40 -44 -84 Q-46 -92 -54 -88 Q-52 -78 -58 -74 Q-70 -66 -72 -56 Q-70 -48 -60 -48 Q-46 -40 -38 -30 Q-30 -20 -26 -10 Q-18 20 -4 32 Q20 44 40 40 Q58 36 60 20 Z" fill="#C07A2E" stroke="#9A5F22" stroke-width="2.5" filter="url(#wc)"/>
    <!-- shoulder/belly shading -->
    <path d="M-20 -10 Q-8 18 8 28" stroke="#9A5F22" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- front legs (bent, rearing) -->
    <path d="M-24 -6 Q-40 8 -44 26 Q-46 37 -37 38 Q-33 28 -33 20 Q-29 6 -20 -2 Z" fill="#A96A26" stroke="#8A5620" stroke-width="2" filter="url(#wc)"/>
    <ellipse cx="-40" cy="37" rx="6" ry="4" fill="#4A3B2E"/>
    <path d="M-16 2 Q-26 22 -24 44 Q-23 56 -32 58 Q-41 54 -38 43 Q-37 22 -28 6 Q-23 0 -16 2 Z" fill="#B0752A" stroke="#8A5620" stroke-width="2" filter="url(#wc)"/>
    <ellipse cx="-33" cy="56" rx="6" ry="4" fill="#4A3B2E"/>
    <!-- mane -->
    <path d="M-46 -84 Q-60 -72 -50 -66 Q-62 -56 -50 -50 Q-62 -40 -48 -35 Q-58 -25 -44 -22 Q-52 -13 -40 -13 L-24 -18 Q-28 -42 -30 -60 Q-32 -78 -40 -88 Z" fill="#5E3A1C" stroke="#472A12" stroke-width="1.8" filter="url(#wc)"/>
    <!-- ears -->
    <path d="M-46 -84 Q-50 -96 -40 -92 Q-38 -86 -42 -80 Z" fill="#C07A2E" stroke="#9A5F22" stroke-width="2" filter="url(#wc)"/>
    <!-- forelock -->
    <path d="M-48 -86 Q-56 -78 -50 -72" stroke="#5E3A1C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="-52" cy="-68" r="3" fill="#3A2C20"/>
    <!-- nostril + mouth -->
    <ellipse cx="-66" cy="-56" rx="2.4" ry="3.2" fill="#5F3F24"/>
    <path d="M-70 -50 Q-64 -47 -58 -50" stroke="#5F3F24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
