    <circle cx="-20" cy="-20" r="5" fill="#B99A7A"/>
    <circle cx="20" cy="-20" r="5" fill="#B99A7A"/>
    <circle cx="0" cy="2" r="30" fill="#A8825E" filter="url(#wc)"/>
    <ellipse cx="0" cy="12" rx="15" ry="12" fill="#CBB08C" filter="url(#wc)"/>
    <ellipse cx="0" cy="7" rx="5" ry="4" fill="#3A2E24"/>
    <circle cx="-11" cy="-2" r="3" fill="#3E3428"/>
    <circle cx="11" cy="-2" r="3" fill="#3E3428"/>
  </g>
</svg>
