<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <g transform="translate(150,150) scale(1.5)">
    <rect x="8" y="-22" width="11" height="48" rx="4" fill="#EAF1F4" stroke="#C3D3DA" stroke-width="2" filter="url(#wc)" transform="rotate(14 13 2)"/>
    <g transform="rotate(-14 -2 2)">
      <rect x="-8" y="-26" width="12" height="52" rx="4" fill="#F6F1E7" stroke="#D8CFBE" stroke-width="2" filter="url(#wc)"/>
      <rect x="-8" y="-26" width="12" height="6" rx="3" fill="#E7695A" opacity="0.6"/>
    </g>
  </g>
</svg>
