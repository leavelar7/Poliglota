<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  <g transform="translate(150,150) scale(1.4)">
    <circle cx="-34" cy="0" r="13" fill="#D9483B" stroke="#B0342A" stroke-width="2" filter="url(#wc)"/>
    <circle cx="0" cy="0" r="13" fill="#E7C44E" stroke="#CBA836" stroke-width="2" filter="url(#wc)"/>
    <circle cx="34" cy="0" r="13" fill="#7CA85C" stroke="#5E8043" stroke-width="2" filter="url(#wc)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#367BEC" stroke-width="2.5" stroke-dasharray="4 3"/>
  </g>
</svg>
